   <!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Configurator Florărie Premium</title>
    <style>
        :root {
            --pink-main: #ff477e;
            --pink-light: #fff0f3;
            --pink-dark: #ff0a54;
            --text-color: #2b2d42;
            --bg-accent: #ffccd5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #fdf0f5;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 71, 126, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 60%, rgba(255, 71, 126, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 50% 30%, rgba(255, 71, 126, 0.03) 0%, transparent 50%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 10px;
        }

        .phone-container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(255, 71, 126, 0.15);
            overflow: hidden;
            border: 2px solid var(--pink-light);
            margin-bottom: 20px;
        }

        .header {
            padding: 20px 15px 10px 15px;
            text-align: center;
            border-bottom: 1px solid var(--pink-light);
        }

        .header h1 {
            color: var(--pink-main);
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 13px;
            color: #70757a;
        }

        .image-section {
            padding: 15px;
            text-align: center;
            background: white;
            position: relative;
        }

        .product-image-wrapper {
            width: 100%;
            height: 320px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        .debug-filename {
            margin-top: 8px;
            font-size: 11px;
            color: #a0a0a0;
            font-style: italic;
        }

        .price-tag {
            font-size: 28px;
            font-weight: 800;
            color: var(--pink-dark);
            margin-top: 10px;
        }

        .config-section {
            padding: 20px 15px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--pink-main);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .color-checkbox {
            display: none;
        }

        .color-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 5px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-align: center;
        }

        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-bottom: 6px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .color-checkbox:checked + .color-label {
            border-color: var(--pink-main);
            background: var(--pink-light);
            color: var(--pink-dark);
            transform: scale(1.03);
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            padding: 5px;
            margin-bottom: 25px;
        }

        .qty-btn {
            width: 45px;
            height: 45px;
            background: var(--pink-light);
            border: none;
            border-radius: 10px;
            color: var(--pink-main);
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .qty-btn:active {
            background: var(--bg-accent);
        }

        .qty-input-wrapper {
            text-align: center;
            flex: 1;
        }

        .qty-input {
            width: 60px;
            border: none;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-color);
            outline: none;
        }

        .qty-hint {
            font-size: 11px;
            color: #70757a;
            margin-top: 2px;
        }

        .addon-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 25px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .addon-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .addon-icon {
            font-size: 24px;
        }

        .addon-text h3 {
            font-size: 14px;
            font-weight: 700;
        }

        .addon-text p {
            font-size: 12px;
            color: #70757a;
        }

        .addon-checkbox {
            width: 22px;
            height: 22px;
            accent-color: var(--pink-main);
            cursor: pointer;
        }

        .addon-card.selected {
            border-color: var(--pink-main);
            background: var(--pink-light);
        }

        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: #25D366;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s;
        }

        .btn-whatsapp:active {
            transform: scale(0.98);
            background: #20ba59;
        }

        .btn-whatsapp svg {
            width: 22px;
            height: 22px;
            fill: white;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header">
        <h1>Florăria Ta Online</h1>
        <p>Configurează-ți buchetul perfect direct de pe telefon</p>
    </div>

    <div class="image-section">
        <div class="product-image-wrapper">
            <img id="productImage" class="product-image" src="buchet-baza.jpg" alt="Buchet Trandafiri" onerror="this.src='buchet-baza.jpg'">
        </div>
        <div id="debugFilename" class="debug-filename">Fișier căutat: buchet-baza.jpg</div>
        <div id="totalPrice" class="price-tag">100 RON</div>
    </div>

    <div class="config-section">
        <div class="section-title">1. Alege culorile trandafirilor</div>
        <div class="options-grid">
            <div>
                <input type="checkbox" id="colorAlbastru" class="color-checkbox" value="albastru" checked onchange="updateConfigurator()">
                <label for="colorAlbastru" class="color-label">
                    <div class="color-dot" style="background: #3a86ff;"></div>
                    Albastru
                </label>
            </div>
            <div>
                <input type="checkbox" id="colorRoz" class="color-checkbox" value="roz" onchange="updateConfigurator()">
                <label for="colorRoz" class="color-label">
                    <div class="color-dot" style="background: #ff758f;"></div>
                    Roz
                </label>
            </div>
            <div>
                <input type="checkbox" id="colorRosu" class="color-checkbox" value="rosu" onchange="updateConfigurator()">
                <label for="colorRosu" class="color-label">
                    <div class="color-dot" style="background: #e63946;"></div>
                    Roșu
                </label>
            </div>
        </div>

        <div class="section-title">2. Câți trandafiri dorești?</div>
        <div class="quantity-selector">
            <button class="qty-btn" onclick="changeQty(-1)">-</button>
            <div class="qty-input-wrapper">
                <input type="number" id="roseQty" class="qty-input" value="19" min="1" onchange="validateAndUpdate()">
                <div class="qty-hint">Ofertă specială la 19 fire!</div>
            </div>
            <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
